name: Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cpp-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows11
          - os: ubuntu-latest
            name: ubuntu-latest
          - os: ubuntu-latest
            name: rhel9
            container: redhat/ubi9:latest
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || null }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify checkout contains the core-engine source tree
        # This job has repeatedly failed downstream with "fatal error:
        # core_engine/bucketing.h: No such file or directory" despite the
        # compiler invocation's -I flag pointing at the correct directory
        # -- reproduced identically across Windows/Ubuntu/RHEL9 and two
        # independent CMake build paths. That pattern points at the file
        # being absent from the checked-out tree itself, not a build-flag
        # problem. Fail immediately, with an unambiguous message and a
        # directory listing, rather than let a missing-file problem
        # surface as a cryptic compiler error deep in the build log.
        shell: bash
        run: |
          set -euo pipefail
          HEADER="libs/core-engine/include/core_engine/bucketing.h"
          echo "--- libs/core-engine tree as checked out ---"
          find libs/core-engine -type f | sort || true
          if [ ! -f "${HEADER}" ]; then
            echo "::error::${HEADER} is missing from this checkout. This is a repository-content issue, not a CI configuration issue: verify the file is committed with 'git ls-files -- ${HEADER}' and pushed to the branch this workflow is running against." >&2
            exit 1
          fi
          echo "OK: ${HEADER} present ($(wc -l < "${HEADER}") lines)."

      - name: Install build tools (RHEL/UBI9)
        if: matrix.name == 'rhel9'
        run: |
          set -euo pipefail
          dnf install -y gcc-toolset-14-gcc-c++ cmake ninja-build git
          echo "/opt/rh/gcc-toolset-14/root/usr/bin" >> "$GITHUB_PATH"

      - name: Install build tools (Ubuntu)
        if: matrix.name == 'ubuntu-latest'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake g++-14 ninja-build

      - name: Install build tools (Windows)
        if: matrix.name == 'windows11'
        run: choco install ninja -y

      - name: Configure (Ubuntu — force GCC 14 for C++26 support)
        if: matrix.name == 'ubuntu-latest'
        working-directory: libs/core-engine
        env:
          # GCC 13 (the ambient default `c++`/`g++` on ubuntu-latest) does
          # not recognize `cxx_std_26`, which is what produced:
          #   "The compiler feature 'cxx_std_26' is not known to CXX
          #    compiler GNU 13.3.0". g++-14 is installed above but was
          #   never selected, so CMake picked the ambient default. Force
          #   it explicitly.
          CC: gcc-14
          CXX: g++-14
        run: cmake -S . -B build -G Ninja -DCORE_ENGINE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows / RHEL9)
        if: matrix.name != 'ubuntu-latest'
        working-directory: libs/core-engine
        run: cmake -S . -B build -G Ninja -DCORE_ENGINE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: libs/core-engine
        run: cmake --build build --config Release

      - name: Test
        working-directory: libs/core-engine
        run: ctest --test-dir build --output-on-failure

  python-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows11
          - os: ubuntu-latest
            name: ubuntu-latest
          - os: ubuntu-latest
            name: rhel9
            container: redhat/ubi9:latest
    needs: cpp-tests
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || null }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify checkout contains the core-engine source tree
        shell: bash
        run: |
          set -euo pipefail
          HEADER="libs/core-engine/include/core_engine/bucketing.h"
          echo "--- libs/core-engine tree as checked out ---"
          find libs/core-engine -type f | sort || true
          if [ ! -f "${HEADER}" ]; then
            echo "::error::${HEADER} is missing from this checkout. This is a repository-content issue, not a CI configuration issue: verify the file is committed with 'git ls-files -- ${HEADER}' and pushed to the branch this workflow is running against." >&2
            exit 1
          fi
          echo "OK: ${HEADER} present ($(wc -l < "${HEADER}") lines)."

      - name: Install base tools (RHEL/UBI9 container)
        if: matrix.name == 'rhel9'
        run: |
          set -euo pipefail
          # UBI9 ships curl-minimal, which owns the same binary path as
          # the full `curl` package; installing `curl` alongside it
          # without --allowerasing fails with a package conflict (this
          # is what produced: "package curl-minimal ... conflicts with
          # curl ..."). curl-minimal already supports the -LsSf flags
          # our uv installer needs, so drop the explicit `curl` package
          # entirely rather than fighting the conflict.
          dnf install -y gcc-toolset-14-gcc-c++ cmake ninja-build git
          echo "/opt/rh/gcc-toolset-14/root/usr/bin" >> "$GITHUB_PATH"

      - name: Setup Python
        # actions/setup-python's relocatable CPython builds run on any
        # glibc-based Linux, including inside the UBI9 container, so no
        # RHEL-specific branching is needed for this step.
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup C++ toolchain (Ubuntu)
        if: matrix.name == 'ubuntu-latest'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake g++-14 ninja-build

      - name: Setup C++ toolchain (Windows)
        if: matrix.name == 'windows11'
        run: choco install ninja -y

      - name: Install uv (Linux/RHEL)
        if: matrix.name != 'windows11'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install uv (Windows)
        if: matrix.name == 'windows11'
        run: powershell -c "irm https://astral.sh/uv/install.ps1 | iex"

      - name: Build and test backend (Ubuntu — force GCC 14)
        if: matrix.name == 'ubuntu-latest'
        working-directory: apps/trading-strategy
        env:
          # Same root cause as the cpp-tests job: ubuntu-latest's ambient
          # GCC 13 doesn't support cxx_std_26 and must be overridden to
          # the GCC 14 installed above.
          CC: gcc-14
          CXX: g++-14
        shell: bash
        run: |
          set -euo pipefail
          source "${HOME}/.local/bin/env" 2>/dev/null || true
          uv venv
          uv pip install ../../libs/core-engine
          uv pip install -e .[dev]
          uv run pytest

      - name: Build and test backend (Windows / RHEL9)
        if: matrix.name != 'ubuntu-latest'
        working-directory: apps/trading-strategy
        # windows-latest GitHub-hosted runners ship Git for Windows,
        # which provides a `bash` shell GitHub Actions can select
        # directly -- so this single step covers both Windows and the
        # RHEL9/UBI9 container without per-OS duplication. RHEL9's
        # gcc-toolset-14 bin dir is already prepended to PATH by the
        # earlier install step; windows-latest resolves a sufficient
        # compiler on its own.
        shell: bash
        run: |
          set -euo pipefail
          source "${HOME}/.local/bin/env" 2>/dev/null || true
          uv venv
          uv pip install ../../libs/core-engine
          uv pip install -e .[dev]
          uv run pytest

      - name: Upload coverage to Codecov
        if: matrix.name == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/trading-strategy/coverage.xml
          flags: python
          fail_ci_if_error: false

  frontend-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows11
          - os: ubuntu-latest
            name: ubuntu-latest
          - os: ubuntu-latest
            name: rhel9
            container: redhat/ubi9:latest
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || null }}
    steps:
      - uses: actions/checkout@v4

      - name: Install base tools (RHEL/UBI9 container)
        if: matrix.name == 'rhel9'
        # actions/checkout falls back to the GitHub REST API when git is
        # absent, but actions/setup-node's tarball extraction and npm
        # itself still expect a minimally populated userland; UBI9's
        # minimal image lacks tar/gzip by default in some tags.
        run: dnf install -y tar gzip git

      - name: Setup Node & TypeScript
        uses: actions/setup-node@v4
        with:
          # node-version 20 is deprecated on GitHub-hosted runners as of
          # late 2025 and prints a deprecation banner; 22 is current LTS.
          node-version: 22
          # `cache: npm` requires cache-dependency-path to resolve to an
          # existing, committed lockfile via hashFiles(); this repo does
          # not commit apps/dashboard/package-lock.json, so the glob
          # matched nothing and setup-node hard-failed with "Some
          # specified paths were not resolved, unable to cache
          # dependencies." Caching is a build-speed optimization, not a
          # correctness requirement -- omit it rather than committing a
          # lockfile purely to satisfy the cache step in a template repo
          # where consumers will regenerate their own dependency tree.

      - name: Install and test
        working-directory: apps/dashboard
        run: |
          npm install
          npm run build
          npm run test

      - name: Upload coverage to Codecov
        if: matrix.name == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/dashboard/coverage/lcov.info
          flags: typescript
          fail_ci_if_error: false

  # ---------------------------------------------------------------------
  # Release: computes the next semantic version, generates a changelog,
  # commits CHANGELOG.md back to `main` (source-controlled), tags the
  # changelog commit itself -- not a stale prior commit -- builds a
  # reproducible source tarball that embeds the updated CHANGELOG.md, and
  # publishes it as a release asset alongside the GitHub release notes.
  # ---------------------------------------------------------------------
  release:
    needs: [cpp-tests, python-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A PAT/App token is required (not the default GITHUB_TOKEN) so
          # the commit this job pushes to a protected `main` branch can
          # itself trigger downstream checks/tags correctly and satisfy
          # required-status-check rules. Falls back to GITHUB_TOKEN if
          # RELEASE_PAT is not configured, for unprotected repos.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Determine next semantic version
        id: next_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          LATEST_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"

          if [ -z "${LATEST_TAG}" ]; then
            NEW_TAG="v0.1.0"
          else
            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r major minor patch <<< "${VERSION}"
            patch=$((patch + 1))
            NEW_TAG="v${major}.${minor}.${patch}"
          fi

          # Guard against a re-run racing an already-published tag.
          if git rev-parse "${NEW_TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${NEW_TAG} already exists; aborting release to avoid overwrite." >&2
            exit 1
          fi

          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog text
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          fromTag: ${{ steps.next_version.outputs.previous_tag }}
          toTag: main
          configurationJson: |
            {
              "categories": [
                { "title": "## \ud83d\ude80 Features",     "labels": ["feature", "enhancement"] },
                { "title": "## \ud83d\udc1b Fixes",         "labels": ["fix", "bug"] },
                { "title": "## \u26a1 Performance",   "labels": ["performance"] },
                { "title": "## \ud83e\uddea Testing/CI",    "labels": ["ci", "test"] },
                { "title": "## \ud83d\udcda Documentation", "labels": ["documentation"] },
                { "title": "## \ud83d\udd27 Other",         "labels": [] }
              ],
              "template": "#{{CHANGELOG}}",
              "pr_template": "- #{{TITLE}} (##{{NUMBER}}) @#{{AUTHOR}}"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write changelog entry to a temp file
        id: changelog_file
        env:
          # Passed as an env var, never string-interpolated into a shell
          # command, so release notes containing backticks/`$()`/quotes
          # cannot execute as code (the vulnerability in the naive
          # `echo "...${{ steps.changelog.outputs.changelog }}..."` form).
          CHANGELOG_BODY: ${{ steps.changelog.outputs.changelog }}
          NEW_TAG: ${{ steps.next_version.outputs.tag }}
        run: |
          set -euo pipefail
          BODY="${CHANGELOG_BODY:-_No user-facing changes recorded._}"
          {
            printf '# Release %s\n\n' "${NEW_TAG}"
            printf '_Released: %s_\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '%s\n' "${BODY}"
          } > /tmp/release_entry.md
          echo "path=/tmp/release_entry.md" >> "$GITHUB_OUTPUT"

      - name: Prepend entry to CHANGELOG.md and commit
        id: commit_changelog
        env:
          NEW_TAG: ${{ steps.next_version.outputs.tag }}
          ENTRY_PATH: ${{ steps.changelog_file.outputs.path }}
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          touch CHANGELOG.md
          cat "${ENTRY_PATH}" <(printf '\n') CHANGELOG.md > /tmp/CHANGELOG.new
          mv /tmp/CHANGELOG.new CHANGELOG.md

          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "::notice::No CHANGELOG.md changes to commit; proceeding with existing HEAD."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(release): update CHANGELOG.md for ${NEW_TAG} [skip ci]"
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the changelog commit
        env:
          NEW_TAG: ${{ steps.next_version.outputs.tag }}
          RELEASE_SHA: ${{ steps.commit_changelog.outputs.sha }}
        run: |
          set -euo pipefail
          git tag -a "${NEW_TAG}" "${RELEASE_SHA}" -m "Release ${NEW_TAG}"
          git push origin "refs/tags/${NEW_TAG}"

      - name: Build source distribution tarball (includes CHANGELOG.md)
        id: tarball
        env:
          NEW_TAG: ${{ steps.next_version.outputs.tag }}
        run: |
          set -euo pipefail
          OUT="QUANT_PROJECT-${NEW_TAG}.tar.gz"
          git archive --format=tar --prefix="QUANT_PROJECT-${NEW_TAG}/" HEAD \
            | gzip -9 > "${OUT}"

          # Fail closed if the archive doesn't actually contain the
          # just-committed changelog -- catches the exact class of bug
          # in the original workflow, where the tag/release predated the
          # commit it was supposed to include.
          if ! tar -tzf "${OUT}" | grep -q "CHANGELOG.md$"; then
            echo "::error::CHANGELOG.md missing from release tarball ${OUT}." >&2
            exit 1
          fi

          sha256sum "${OUT}" > "${OUT}.sha256"
          echo "path=${OUT}" >> "$GITHUB_OUTPUT"
          echo "checksum_path=${OUT}.sha256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.next_version.outputs.tag }}
          name: Release ${{ steps.next_version.outputs.tag }}
          target_commitish: ${{ steps.commit_changelog.outputs.sha }}
          body_path: ${{ steps.changelog_file.outputs.path }}
          files: |
            ${{ steps.tarball.outputs.path }}
            ${{ steps.tarball.outputs.checksum_path }}
          fail_on_unmatched_files: true

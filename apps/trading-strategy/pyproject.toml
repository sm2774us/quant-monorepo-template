[project]
name = "trading-strategy"
version = "0.1.0"
description = "Systematic TCA API + CLI"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.1",
    "typer>=0.13",
    "core_engine",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
trading-strategy = "trading_strategy.cli:main"

[tool.uv.sources]
core_engine = { path = "../../libs/core-engine", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=trading_strategy --cov-report=term-missing --cov-report=xml --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["src/trading_strategy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_strategy"]
